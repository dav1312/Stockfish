name: Stockfish
on:
  workflow_dispatch: # TEMPORARY (Allows manual run triggering from GitHub interface)
  push:
    tags:
      - "*"
    branches:
      - master
      - tools
      - github_ci
      - test-apk-packaging # TEMPORARY (Runs automatically on push to this branch)
  pull_request:
    branches:
      - master
      - tools

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  Prerelease:
    name: Prerelease
    if: github.repository == 'official-stockfish/Stockfish' && (github.ref == 'refs/heads/master' || (startsWith(github.ref_name, 'sf_') && github.ref_type == 'tag'))
    runs-on: ubuntu-latest
    needs: [Matrix, ARMCompilation, UniversalCompilation]
    permissions:
      contents: write # For deleting/creating a prerelease
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0

      # returns null if no pre-release exists
      - name: Get Commit SHA of Latest Pre-release
        run: |
          # Install required packages
          sudo apt-get update
          sudo apt-get install -y curl jq

          echo "COMMIT_SHA_TAG=$(jq -r 'map(select(.prerelease)) | first | .tag_name' <<< $(curl -s https://api.github.com/repos/${{ github.repository_owner }}/Stockfish/releases))" >> $GITHUB_ENV

      # delete old previous pre-release and tag
      - run: gh release delete ${{ env.COMMIT_SHA_TAG }} --cleanup-tag
        if: env.COMMIT_SHA_TAG != 'null'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Make sure that an old ci that still runs on master doesn't recreate a prerelease
      - name: Check Pullable Commits
        id: check_commits
        run: |
          git fetch
          CHANGES=$(git rev-list HEAD..origin/master --count)
          echo "CHANGES=$CHANGES" >> $GITHUB_ENV

      - name: Get last commit SHA
        id: last_commit
        run: echo "COMMIT_SHA=$(git rev-parse HEAD | cut -c 1-8)" >> $GITHUB_ENV

      - name: Get commit date
        id: commit_date
        run: echo "COMMIT_DATE=$(git show -s --date=format:'%Y%m%d' --format=%cd HEAD)" >> $GITHUB_ENV

      - name: Official Release?
        id: official_release
        # Check for "Official release version of Stockfish" in the commit message
        run: |
          if git log -1 --pretty=%B | grep -q "Official release version of Stockfish"; then
            echo "OFFICIAL_RELEASE=true" >> $GITHUB_ENV
          else
            echo "OFFICIAL_RELEASE=false" >> $GITHUB_ENV
          fi

      # Get recent commits for release body
      - name: Get commits in this push
        id: recent_commits
        run: |
          COMMITS=$(git log \
            --format="- [\`%h\`](https://github.com/${{ github.repository }}/commit/%H) *%s*" \
            ${{ github.event.before }}..HEAD)
          echo "COMMITS<<EOF" >> $GITHUB_OUTPUT
          echo "$COMMITS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      # Create a new pre-release, the other upload_binaries.yml will upload the binaries
      # to this pre-release.
      - name: Create Prerelease
        if: github.ref_name == 'master' && env.CHANGES == '0' && env.OFFICIAL_RELEASE == 'false'
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          name: Stockfish dev-${{ env.COMMIT_DATE }}-${{ env.COMMIT_SHA }}
          tag_name: stockfish-dev-${{ env.COMMIT_DATE }}-${{ env.COMMIT_SHA }}
          prerelease: true
          body: |
            Precompiled binaries of the latest Stockfish development version, built automatically on every commit.
            
            > [!NOTE]
            > For stable, thoroughly tested builds use the [official releases](https://github.com/official-stockfish/Stockfish/releases).
            > Pre-releases may contain bugs.
            
            *Some platforms ship a **universal binary** that automatically selects the best
            instruction set for your CPU - no manual selection needed.*
            
            ---
            
            ## Commits
            
            ${{ steps.recent_commits.outputs.COMMITS }}
            
            [View all commits →](https://github.com/${{ github.repository }}/commits/master)
  Matrix:
    name: Prepare matrices
    runs-on: ubuntu-latest
    outputs:
      arm_matrix: ${{ steps.set-arm-matrix.outputs.arm_matrix }}
      universal_matrix: ${{ steps.set-universal-matrix.outputs.universal_matrix }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - id: set-arm-matrix
        run: |
          ARM_MATRIX=$(jq -c '.' .github/ci/arm_matrix.json)
          echo "ARM_MATRIX=$ARM_MATRIX" >> $GITHUB_OUTPUT
      - id: set-universal-matrix
        run: |
          UNIVERSAL_MATRIX=$(jq -c '.' .github/ci/universal_matrix.json)
          echo "UNIVERSAL_MATRIX=$UNIVERSAL_MATRIX" >> $GITHUB_OUTPUT

  # Testing Jobs
  IWYU:
    name: IWYU
    if: false # TEMPORARY (Disabled to bypass long-running checks)
    uses: ./.github/workflows/iwyu.yml
  Sanitizers:
    name: Sanitizers
    if: false # TEMPORARY (Disabled to bypass long-running checks)
    uses: ./.github/workflows/sanitizers.yml
  Tests:
    name: Tests
    if: false # TEMPORARY (Disabled to bypass long-running checks)
    uses: ./.github/workflows/tests.yml
  Matetrack:
    name: Matetrack
    if: false # TEMPORARY (Disabled to bypass long-running checks)
    uses: ./.github/workflows/matetrack.yml
  Games:
    name: Games
    if: false # TEMPORARY (Disabled to bypass long-running checks)
    uses: ./.github/workflows/games.yml
  CompilerCheck:
    name: Compiler check
    if: false # TEMPORARY (Disabled to bypass long-running checks)
    uses: ./.github/workflows/avx2_compilers.yml
  WASMCompilation:
    name: WASM compilation
    if: false # TEMPORARY (Disabled to bypass long-running checks)
    uses: ./.github/workflows/wasm_compilation.yml

  # Release Jobs
  ARMCompilation:
    name: Android builds
    needs: [Matrix] # TEMPORARY (Normally needs: [Matrix, Sanitizers, Tests, Matetrack, Games, CompilerCheck])
    uses: ./.github/workflows/arm_compilation.yml
    with:
      matrix: ${{ needs.Matrix.outputs.arm_matrix }}
  UniversalCompilation:
    name: "Universal builds"
    if: false # TEMPORARY (Disabled to bypass long-running checks)
    needs: [Matrix, Sanitizers, Tests, Matetrack, Games, CompilerCheck]
    uses: ./.github/workflows/universal_compilation.yml
  ARM_Binaries:
    if: false # TEMPORARY (Disabled during APK test runs)
    name: Android uploads
    needs: [Prerelease, Matrix]
    uses: ./.github/workflows/upload_binaries.yml
    with:
      matrix: ${{ needs.Matrix.outputs.arm_matrix }}
    permissions:
      contents: write # For deleting/creating a (pre)release
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}
  Universal_Binaries:
    if: false # TEMPORARY (Disabled during APK test runs)
    name: Universal binaries
    needs: [Prerelease, Matrix]
    uses: ./.github/workflows/upload_binaries.yml
    with:
      matrix: ${{ needs.Matrix.outputs.universal_matrix }}
    permissions:
      contents: write # For deleting/creating a (pre)release
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}

  Android_APK:
    name: Package Android APK
    needs: [ARMCompilation] # TEMPORARY (Normally needs: [Prerelease, ARMCompilation] once testing is complete)
    runs-on: ubuntu-latest
    permissions:
      contents: write # Grants permission to attach the APK to the release
    steps:
      - name: Checkout Stockfish repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Get last commit sha
        id: last_commit
        run: echo "COMMIT_SHA=$(git rev-parse HEAD | cut -c 1-8)" >> $GITHUB_ENV

      - name: Get commit date
        id: commit_date
        run: echo "COMMIT_DATE=$(git show -s --date=format:'%Y%m%d' --format=%cd HEAD)" >> $GITHUB_ENV

      - name: Clone Chess Engine Support library (master branch)
        run: |
          git clone --depth 1 -b master https://github.com/LeelaChessZero/chessenginesupport-androidlib.git wrapper-repo

      - name: Download compiled arm64 binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: android arm64-universal
          path: android-arm64

      - name: Inject binaries into the Android project
        run: |
          TARGET_DIR="wrapper-repo/StockfishChessEngine/stockfishChessEngine/src/main/jniLibs"
          mkdir -p "$TARGET_DIR/arm64-v8a"

          # Copy and rename native binary
          cp android-arm64/stockfish-android-arm64-universal "$TARGET_DIR/arm64-v8a/libstockfish.so"

          # Set executable permissions on binary
          chmod +x "$TARGET_DIR/arm64-v8a/libstockfish.so"

      - name: Disable Gradle native library stripping and hide NDK
        run: |
          # Inject packagingOptions doNotStrip configurations to skip native library stripping.
          sed -i '/defaultConfig {/i \    packagingOptions { doNotStrip "**/*.so" }' wrapper-repo/StockfishChessEngine/stockfishChessEngine/build.gradle

          # Delete pre-installed NDK directories in the runner.
          # When no NDK is detected and doNotStrip is enabled, Gradle copies the .so binaries directly without triggering validation crashes.
          rm -rf $ANDROID_HOME/ndk
          rm -rf $ANDROID_HOME/ndk-bundle
          rm -rf /usr/local/lib/android/sdk/ndk
          rm -rf /usr/local/lib/android/sdk/ndk-bundle

      - name: Upgrade target SDK and fix manifest for Android 14+ compatibility
        run: |
          # 1. Update compile and target SDK versions to API 34 across build.gradle files
          find wrapper-repo/StockfishChessEngine -name "build.gradle" -exec sed -i 's/compileSdkVersion 28/compileSdkVersion 34/g' {} +
          find wrapper-repo/StockfishChessEngine -name "build.gradle" -exec sed -i 's/targetSdkVersion 28/targetSdkVersion 34/g' {} +
          find wrapper-repo/StockfishChessEngine -name "build.gradle" -exec sed -i 's/buildToolsVersion "28.0.3"/buildToolsVersion "34.0.0"/g' {} +

          # 2. Add android:exported="true" to MainActivity for Android 12+ manifest validation requirements
          sed -i 's/android:name="com.kalab.chess.stockfishengine.MainActivity"/android:name="com.kalab.chess.stockfishengine.MainActivity"\n            android:exported="true"/g' wrapper-repo/StockfishChessEngine/stockfishChessEngine/src/main/AndroidManifest.xml

          # 3. Change category to LAUNCHER to show an app icon
          sed -i 's/android.intent.category.DEFAULT/android.intent.category.LAUNCHER/g' wrapper-repo/StockfishChessEngine/stockfishChessEngine/src/main/AndroidManifest.xml

          # 4. Download and overwrite default ic_launcher placeholders with the official Stockfish PNG logo
          LOGO_URL="https://raw.githubusercontent.com/official-stockfish/stockfish-web/refs/heads/master/static/images/logo/icon_128x128%402x.png"
          curl -s -L "$LOGO_URL" -o official_logo.png
          
          RES_DIR="wrapper-repo/StockfishChessEngine/stockfishChessEngine/src/main/res"
          cp official_logo.png "$RES_DIR/drawable-hdpi/ic_launcher.png"
          cp official_logo.png "$RES_DIR/drawable-ldpi/ic_launcher.png"
          cp official_logo.png "$RES_DIR/drawable-mdpi/ic_launcher.png"
          cp official_logo.png "$RES_DIR/drawable-xhdpi/ic_launcher.png"
          cp official_logo.png "$RES_DIR/drawable-xxhdpi/ic_launcher.png"

      - name: Update MainActivity to show a helpful Toast message on launch
        run: |
          # Replace MainActivity Java code to trigger a helpful popup on launch rather than closing silently.
          cat << 'EOF' > wrapper-repo/StockfishChessEngine/stockfishChessEngine/src/main/java/com/kalab/chess/stockfishengine/MainActivity.java
          package com.kalab.chess.stockfishengine;

          import android.app.Activity;
          import android.os.Bundle;
          import android.widget.Toast;

          public class MainActivity extends Activity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  Toast.makeText(this, "Stockfish Engine ready. Please select this engine inside your Chess GUI settings.", Toast.LENGTH_LONG).show();
                  finish();
              }
          }
          EOF

      - name: Update engine list metadata
        run: |
          VERSION_NAME="Stockfish test-${{ env.COMMIT_DATE }}-${{ env.COMMIT_SHA }}" # TEMPORARY (normally uses dev- or release tag)
          
          # Overwrite enginelist.xml to only include the built Stockfish version and targets
          cat <<EOF > wrapper-repo/StockfishChessEngine/stockfishChessEngine/src/main/res/xml/enginelist.xml
          <?xml version="1.0" encoding="utf-8"?>
          <enginelist>
              <engine
                  name="${VERSION_NAME}"
                  filename="libstockfish.so"
                  target="arm64-v8a" />
          </enginelist>
          EOF

      - name: Set up JDK 17 (for SDK Manager)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Accept licenses and install Android SDK dependencies
        run: |
          # Explicitly install SDK platforms and build tools to avoid build-environment conflicts
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Set up JDK 11 (for Gradle compilation)
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Compile APK
        working-directory: wrapper-repo/StockfishChessEngine
        env:
          # Unset NDK environment variables to prevent old AGP versions from looking for NDK paths
          ANDROID_NDK_HOME: ""
          ANDROID_NDK_ROOT: ""
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Prepare APK Release Artifact
        run: |
          VERSION_NAME="stockfish-test-${{ env.COMMIT_DATE }}-${{ env.COMMIT_SHA }}" # TEMPORARY (normally uses dev- or release tag)
          
          # Copy the completed APK and rename it to match the release styling
          cp wrapper-repo/StockfishChessEngine/stockfishChessEngine/build/outputs/apk/debug/stockfishChessEngine-debug.apk ./${VERSION_NAME}.apk
          echo "APK_NAME=${VERSION_NAME}.apk" >> $GITHUB_ENV

      # Upload to the run summary page instead of generating a GitHub Release
      - name: Upload APK as Run Artifact # TEMPORARY
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.APK_NAME }}
          path: ./${{ env.APK_NAME }}

      # - name: Upload APK to Release / Prerelease # TEMPORARY (Uncomment this for production and remove upload-artifact step above)
      #   uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
      #   with:
      #     files: ${{ env.APK_NAME }}
      #     tag_name: ${{ github.ref_name == 'master' && format('stockfish-dev-{0}-{1}', env.COMMIT_DATE, env.COMMIT_SHA) || github.ref_name }}
      #     prerelease: ${{ github.ref_name == 'master' }}
      #   env:
      #     GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
