name: Package Android APK

on:
  workflow_call:
    inputs:
      version_name:
        description: "Engine display name embedded in enginelist.xml (e.g., 'Stockfish 19')"
        required: true
        type: string
      apk_name:
        description: "Output filename for the APK (e.g., 'stockfish-19.apk')"
        required: true
        type: string
    secrets:
      SIGNING_KEY:
        description: "Base64 encoded keystore file"
        required: false
      KEYSTORE_PASSWORD:
        description: "Keystore password"
        required: false
      KEY_ALIAS:
        description: "Signing key alias"
        required: false
      KEY_PASSWORD:
        description: "Signing key password"
        required: false

jobs:
  package:
    name: Build and Package APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Stockfish repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Clone Chess Engine Support library
        run: |
          git clone https://github.com/dav1312/chessenginesupport-androidlib.git wrapper-repo
          git -C wrapper-repo checkout f1a13ceed7c5cd780587c983d2974897ea15b30e

      - name: Download compiled arm64 binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: android arm64-universal
          path: android-arm64

      - name: Inject binaries into the Android project
        run: |
          TARGET_DIR="wrapper-repo/StockfishChessEngine/stockfishChessEngine/src/main/jniLibs/arm64-v8a"
          mkdir -p "$TARGET_DIR"
          cp android-arm64/stockfish-android-arm64-universal "$TARGET_DIR/libstockfish.so"
          chmod +x "$TARGET_DIR/libstockfish.so"

      - name: Update engine list metadata
        env:
          VERSION_NAME: ${{ inputs.version_name }}
        run: |
          cat <<EOF > wrapper-repo/StockfishChessEngine/stockfishChessEngine/src/main/res/xml/enginelist.xml
          <?xml version="1.0" encoding="utf-8"?>
          <enginelist>
              <engine
                  name="${VERSION_NAME}"
                  filename="libstockfish.so"
                  target="arm64-v8a" />
          </enginelist>
          EOF

      - name: Set up JDK 17
        uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520 # v5.4.0
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          packages: "platforms;android-35 build-tools;35.0.0"

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEY }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "${{ runner.temp }}/stockfish.keystore"
            echo "SIGNING_KEY_FILE=${{ runner.temp }}/stockfish.keystore" >> $GITHUB_ENV
          else
            echo "WARNING: SIGNING_KEY secret is not set. Building with debug signature."
          fi

      - name: Compile APK
        working-directory: wrapper-repo/StockfishChessEngine
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Cleanup Keystore
        if: always()
        run: rm -f "${{ runner.temp }}/stockfish.keystore"

      - name: Prepare APK Release Artifact
        env:
          APK_NAME: ${{ inputs.apk_name }}
        run: |
          cp wrapper-repo/StockfishChessEngine/stockfishChessEngine/build/outputs/apk/debug/stockfishChessEngine-debug.apk "./${APK_NAME}"

      - name: Upload APK as Run Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.apk_name }}
          path: ./${{ inputs.apk_name }}
